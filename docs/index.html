<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>埋伏股掃描</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1EE; --sheet:#F7F9F7; --ink:#18222B; --muted:#5B6870; --line:#C5CEC8;
  --up:#C0262D; --up-soft:#F3D9DA; --down:#2E7D5B; --fire:#A86B00;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141A1E; --sheet:#1B2328; --ink:#E4EAE6; --muted:#97A3A9; --line:#33403F;
  --up:#E5555B; --up-soft:#3A2224; --down:#5DBB8E; --fire:#E0A43A;}}
:root[data-theme="dark"]{--paper:#141A1E; --sheet:#1B2328; --ink:#E4EAE6; --muted:#97A3A9;
  --line:#33403F; --up:#E5555B; --up-soft:#3A2224; --down:#5DBB8E; --fire:#E0A43A;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.65 var(--sans);
  font-variant-numeric:tabular-nums}
main{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
h1{font:900 clamp(34px,6vw,56px)/1.05 var(--serif);margin:0;letter-spacing:.02em}
.lede{color:var(--muted);max-width:62ch;margin:14px 0 0}
.warn{margin:18px 0 0;padding:10px 14px;border-left:3px solid var(--fire);background:var(--sheet);
  font-size:13px;color:var(--muted)}
.warn li{margin:2px 0}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:32px 0 10px;
  padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.controls input[type=search]{font:inherit;color:inherit;background:var(--sheet);
  border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:220px}
.controls label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.controls select{font:inherit;color:inherit;background:var(--sheet);border:1px solid var(--line);
  border-radius:6px;padding:4px 6px}
.legend{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.legend i{display:inline-block;width:22px;height:8px;border-radius:2px}
ol{list-style:none;margin:0;padding:0}
.row{border-bottom:1px solid var(--line)}
.head{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;
  grid-template-columns:2.4em 1fr 4.2em 168px;gap:14px;align-items:center;padding:14px 4px}
.head:focus-visible{outline:2px solid var(--up);outline-offset:2px;border-radius:4px}
.rank{color:var(--muted);font-size:13px;text-align:right}
.name{font:600 19px/1.3 var(--serif)}
.name small{font:500 13px var(--sans);color:var(--muted);margin-left:8px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.flag{display:inline-block;font-size:12px;padding:0 7px;margin-right:6px;border-radius:3px;
  border:1px solid var(--line);color:var(--muted)}
.flag.fire{border-color:var(--fire);color:var(--fire);font-weight:700}
.score{font:900 26px/1 var(--serif);text-align:right}
.score span{display:block;font:400 11px var(--sans);color:var(--muted);margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.strip div{height:30px;border-radius:2px;background:var(--line);position:relative}
.strip div b{position:absolute;inset:auto 0 0 0;background:var(--up);border-radius:2px}
.strip div em{position:absolute;inset:auto 0 -16px;font:normal 10.5px var(--sans);
  color:var(--muted);text-align:center}
.body{display:none;padding:6px 4px 26px 3.4em}
.row.open .body{display:block}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 32px;margin-top:10px}
.dims h3{font:600 15px var(--serif);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sig{display:grid;grid-template-columns:5.5em 52px 1fr;gap:10px;align-items:baseline;
  font-size:13.5px;margin:6px 0}
.sig .bar{height:6px;background:var(--line);border-radius:3px;position:relative;top:-2px}
.sig .bar b{position:absolute;inset:0 auto 0 0;background:var(--up);border-radius:3px}
.sig.na{color:var(--muted)} .sig.na .bar{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}
.trig{margin:10px 0 0;color:var(--fire);font-weight:500}
.links{margin-top:16px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px}
.links a{color:var(--down)}
.empty{padding:48px 0;color:var(--muted);max-width:60ch}
.foot{margin-top:40px;font-size:12px;color:var(--muted);max-width:70ch}
@media (max-width:640px){
  .head{grid-template-columns:1.8em 1fr 3.4em;}
  .strip{grid-column:2/4;margin-bottom:14px}
  .body{padding-left:4px}
  .legend{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.strip div b{transition:height .5s ease}}
</style>
</head>
<body>
<main>
  <h1>埋伏股掃描</h1>
  <p class="lede" id="lede">載入結果中…</p>
  <div id="warn"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="搜尋代號或名稱" aria-label="搜尋代號或名稱">
    <label><input type="checkbox" id="fired"> 只看已點火</label>
    <label>資料覆蓋 ≥
      <select id="cov"><option value="0">不限</option><option value="0.7">70%</option><option value="0.85">85%</option></select>
    </label>
    <div class="legend" aria-hidden="true"><i style="background:var(--up)"></i>四柱依序：籌碼・技術・基本・心理</div>
  </div>

  <ol id="list"></ol>
  <p class="foot">分數為條件符合程度，不是報酬預測，也不構成投資建議。主力分點以法人買賣與資金流量推估；內部人增持依每月董監持股快照比較；媒體聲量僅涵蓋 Google 新聞與 PTT 股板，Dcard 與 Mobile01 請用連結人工確認。</p>
</main>
<script>
const $ = s => document.querySelector(s);
let DATA = null;
const pct = x => x == null ? "—" : Math.round(x * 100) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dimScore(it, keys) {
  let n = 0, d = 0;
  for (const k of keys) {
    const s = it.signals[k]?.score, w = DATA.weights[k] || 1;
    if (s != null) { n += s * w; d += w; }
  }
  return d ? n / d : null;
}

function render() {
  const q = $("#q").value.trim(), onlyFired = $("#fired").checked, cov = +$("#cov").value;
  const items = DATA.items.filter(it =>
    (!q || it.code.includes(q) || it.name.includes(q)) &&
    (!onlyFired || it.trigger.fired) && it.coverage >= cov);
  const list = $("#list");
  if (!DATA.items.length) {
    list.innerHTML = `<li class="empty">這次沒有股票同時通過技術面初選與資料覆蓋門檻。可在 config.yaml 放寬 stage1.max_spread 或 technical.base.max_range 後，到 Actions 手動重跑。</li>`;
    return;
  }
  if (!items.length) { list.innerHTML = `<li class="empty">沒有符合篩選條件的股票，請清除搜尋或放寬覆蓋率。</li>`; return; }
  const dims = Object.entries(DATA.dimensions);
  list.innerHTML = items.map((it, i) => {
    const strip = dims.map(([name, keys]) => {
      const s = dimScore(it, keys);
      return `<div title="${name} ${pct(s)}"><b style="height:${s == null ? 0 : Math.max(4, s * 100)}%"></b><em>${name.slice(0,2)}</em></div>`;
    }).join("");
    const flags = it.flags.map(f => `<span class="flag ${f === "已點火" ? "fire" : ""}">${esc(f)}</span>`).join("");
    const groups = dims.map(([name, keys]) => `<section><h3>${name}</h3>${keys.map(k => {
      const s = it.signals[k]; if (!s) return "";
      const na = s.score == null;
      return `<div class="sig ${na ? "na" : ""}"><span>${DATA.labels[k]}</span>
        <span class="bar"><b style="width:${na ? 0 : s.score * 100}%"></b></span>
        <span>${esc(s.detail)}</span></div>`;
    }).join("")}</section>`).join("");
    const L = it.links;
    return `<li class="row" id="r${it.code}">
      <button class="head" aria-expanded="false" aria-controls="b${it.code}">
        <span class="rank">${i + 1}</span>
        <span><span class="name">${esc(it.name)}<small>${it.code}・${it.market === "twse" ? "上市" : "上櫃"}</small></span>
          <div class="sub">${flags}${esc(it.industry)}　收盤 ${it.close}（${it.date}）</div></span>
        <span class="score">${it.score.toFixed(1)}<span>覆蓋 ${pct(it.coverage)}</span></span>
        <span class="strip">${strip}</span>
      </button>
      <div class="body" id="b${it.code}">
        ${it.trigger.fired ? `<p class="trig">${esc(it.trigger.detail)}</p>` : ""}
        <div class="dims">${groups}</div>
        <div class="links">人工確認：
          <a href="${L.news}" target="_blank" rel="noopener">Google 新聞</a>
          <a href="${L.ptt}" target="_blank" rel="noopener">PTT 股板</a>
          <a href="${L.dcard}" target="_blank" rel="noopener">Dcard 股票板</a>
          <a href="${L.mobile01}" target="_blank" rel="noopener">Mobile01</a>
          <a href="${L.goodinfo}" target="_blank" rel="noopener">Goodinfo</a>
        </div>
      </div></li>`;
  }).join("");
}

$("#list").addEventListener("click", e => {
  const btn = e.target.closest(".head"); if (!btn) return;
  const row = btn.parentElement, open = row.classList.toggle("open");
  btn.setAttribute("aria-expanded", open);
});
["#q", "#fired", "#cov"].forEach(s => $(s).addEventListener("input", render));

fetch("results.json", {cache: "no-store"}).then(r => {
  if (!r.ok) throw new Error(r.status);
  return r.json();
}).then(d => {
  DATA = d;
  $("#lede").textContent = d.generated_at
    ? `${d.generated_at} 掃描。股票池 ${d.universe} 檔，技術面初選 ${d.stage1} 檔，深入分析 ${d.stage2} 檔，列出 ${d.items.length} 檔。點選任一列查看各項條件的實際數據。`
    : "尚未執行過掃描。請到 GitHub 的 Actions 分頁手動執行 screen 工作流程。";
  if (d.warnings?.length) $("#warn").innerHTML =
    `<div class="warn"><strong>本次執行的資料限制</strong><ul>${d.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>`;
  render();
}).catch(() => {
  $("#lede").textContent = "找不到 results.json。請先到 Actions 分頁執行一次 screen 工作流程，完成後重新整理此頁。";
});
</script>
</body>
</html>
