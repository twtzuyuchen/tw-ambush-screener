name: screen

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 台灣時間週一至週五 18:40（收盤資料更新後）
  workflow_dispatch:
    inputs:
      limit:
        description: "只跑前 N 檔（0 = 全市場，除錯用）"
        default: "0"

permissions:
  contents: write

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 離線測試
        run: python -m pytest -q

      - name: 執行選股
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TZ: Asia/Taipei
        run: python -m screener.main --limit "${{ github.event.inputs.limit || 0 }}"

      - name: 提交結果與累積資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "screen $(TZ=Asia/Taipei date +%F)"
          git push
